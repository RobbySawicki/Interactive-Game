<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LED Truck Display</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: radial-gradient(circle at 50% 40%, #1a1f2e 0%, #000 70%);
      }
      #headline {
        font-size: 8vw;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        margin: 0;
      }
      #score {
        font-size: 28vw;
        font-weight: 900;
        line-height: 1;
        margin: 0;
        background: linear-gradient(180deg, #ff3366, #ffcc33);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        transition: transform 120ms ease-out;
      }
      #status {
        font-size: 3vw;
        opacity: 0.7;
        margin: 0;
      }
      .pop {
        animation: pop 220ms ease-out;
      }
      @keyframes pop {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(1.18);
        }
        100% {
          transform: scale(1);
        }
      }
      #confetti {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .demo {
        position: fixed;
        bottom: 16px;
        right: 24px;
        font-size: 1.2vw;
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <h1 id="headline">Tap to Win</h1>
      <div id="score">0</div>
      <p id="status">Waiting for player…</p>
    </div>
    <canvas id="confetti"></canvas>
    <div class="demo" id="demo"></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getDatabase,
        ref,
        onValue,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
      import { firebaseConfig, SESSION_ID } from "../shared/firebase-config.js";

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const sessionRef = ref(db, `sessions/${SESSION_ID}`);

      const $score = document.getElementById("score");
      const $status = document.getElementById("status");
      const $headline = document.getElementById("headline");

      const setScore = (n) => {
        $score.textContent = n;
        $score.classList.remove("pop");
        void $score.offsetWidth;
        $score.classList.add("pop");
      };

      // Confetti — minimal, runs on "end" events.
      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");
      const resize = () => {
        canvas.width = innerWidth;
        canvas.height = innerHeight;
      };
      resize();
      addEventListener("resize", resize);
      let particles = [];
      const burst = () => {
        const colors = ["#ff3366", "#ffcc33", "#33ccff", "#66ff99", "#ffffff"];
        for (let i = 0; i < 240; i++) {
          particles.push({
            x: canvas.width / 2,
            y: canvas.height / 2,
            vx: (Math.random() - 0.5) * 18,
            vy: (Math.random() - 1) * 14,
            g: 0.35,
            life: 120,
            color: colors[(Math.random() * colors.length) | 0],
            size: 4 + Math.random() * 6,
          });
        }
      };
      const tick = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles = particles.filter((p) => p.life-- > 0);
        for (const p of particles) {
          p.vy += p.g;
          p.x += p.vx;
          p.y += p.vy;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        }
        requestAnimationFrame(tick);
      };
      tick();

      // Offline demo loop — counts up if no live data within 10s.
      let lastUpdate = 0;
      let demoTimer = null;
      const startDemo = () => {
        if (demoTimer) return;
        document.getElementById("demo").textContent = "demo mode";
        let n = 0;
        demoTimer = setInterval(() => {
          n = (n + 1) % 100;
          setScore(n);
          $status.textContent = "Demo loop";
        }, 200);
      };
      const stopDemo = () => {
        if (demoTimer) {
          clearInterval(demoTimer);
          demoTimer = null;
          document.getElementById("demo").textContent = "";
        }
      };
      setInterval(() => {
        if (Date.now() - lastUpdate > 10000) startDemo();
      }, 2000);

      onValue(sessionRef, (snap) => {
        const data = snap.val();
        if (!data) return;
        lastUpdate = Date.now();
        stopDemo();
        setScore(data.score ?? 0);
        if (data.event === "start") $status.textContent = "Game on!";
        else if (data.event === "end") {
          $status.textContent = "Final score";
          burst();
        } else $status.textContent = "Live";
      });
    </script>
  </body>
</html>
