<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Cookie Toss — Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fugaz+One&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; background:#0B221F; font-family: Inter, system-ui, sans-serif; color:#F5EDE0; }
    * { box-sizing: border-box; }
    #root { width:100vw; height:100vh; }

    /* layout for the two panels — query string ?view=side or ?view=rear forces just one */
    .panel-stack {
      width:100%; height:100%; display:grid; gap:12px; padding:12px;
      grid-template-rows: 1fr 1fr;
    }
    .panel-stack.solo  { grid-template-rows: 1fr; padding:0; gap:0; }
    .panel-frame {
      position:relative; border-radius:14px; overflow:hidden;
      background:#000; border:1px solid #222;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 30px 60px -20px rgba(0,0,0,0.6);
    }
    .panel-frame > div { width:100%; height:100%; }
    .panel-stack.solo .panel-frame { border-radius:0; border:none; box-shadow:none; }

    .panel-label {
      position:absolute; top:8px; left:10px; z-index:99;
      font-family: 'Lilita One', system-ui, sans-serif;
      font-size:11px; letter-spacing:0.18em; color:rgba(245,237,224,0.55);
      pointer-events:none; mix-blend-mode:difference;
    }
    body.solo .panel-label { display:none; }
  </style>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <rect width="200" height="200" fill="#143F3C"/>
      <rect x="20" y="60" width="160" height="40" rx="4" fill="#F0B22A"/>
      <rect x="80" y="120" width="40" height="20" rx="2" fill="#F5EDE0"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="../cookies.jsx"></script>
  <script type="text/babel" src="../game-shared.jsx"></script>
  <script type="text/babel" src="../panel-display.jsx"></script>

  <script type="text/babel">
    function PanelHost() {
      const params = new URLSearchParams(location.search);
      const view = params.get('view') || 'both';
      const solo = view === 'side' || view === 'rear';
      React.useEffect(() => {
        document.body.classList.toggle('solo', solo);
      }, [solo]);
      if (view === 'side') return (
        <div className="panel-stack solo">
          <div className="panel-frame"><PanelSide /></div>
        </div>
      );
      if (view === 'rear') return (
        <div className="panel-stack solo">
          <div className="panel-frame"><PanelRear /></div>
        </div>
      );
      return (
        <div className="panel-stack">
          <div className="panel-frame">
            <span className="panel-label">SIDE — 1007×432</span>
            <PanelSide />
          </div>
          <div className="panel-frame">
            <span className="panel-label">REAR — 432×432</span>
            <PanelRear />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<PanelHost />);
  </script>
</body>
</html>
