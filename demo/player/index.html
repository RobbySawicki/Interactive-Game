<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Cookie Toss — Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fugaz+One&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; background:#F5EDE0; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    #root { width:100vw; height:100vh; }
  </style>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <rect width="200" height="200" fill="#F5EDE0"/>
      <circle cx="100" cy="100" r="58" fill="#2A1810"/>
      <circle cx="100" cy="100" r="36" fill="#F5E6C8"/>
      <polygon fill="#E85A4F" points="100,76 105,93 122,93 108,103 113,120 100,110 87,120 92,103 78,93 95,93"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="../tweaks-panel.jsx"></script>
  <script type="text/babel" src="../cookies.jsx"></script>
  <script type="text/babel" src="../game-shared.jsx"></script>
  <script type="text/babel" src="../cookie-toss-ui.jsx"></script>
  <script type="text/babel" src="../cookie-toss-game.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "throwPower": 1.0,
      "targetSpeed": 1.0,
      "gravity": 1.0,
      "showHints": true
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      return (
        <div style={{ width:'100%', height:'100%', position:'relative' }}>
          <CookieToss tweaks={t} />
          <TweaksPanel title="Tweaks">
            <TweakSection label="Game Feel">
              <TweakSlider label="Throw Power"  value={t.throwPower}  onChange={v => setTweak('throwPower',  v)} min={0.5} max={2.0} step={0.05} />
              <TweakSlider label="Target Speed" value={t.targetSpeed} onChange={v => setTweak('targetSpeed', v)} min={0.5} max={2.5} step={0.05} />
              <TweakSlider label="Gravity"      value={t.gravity}     onChange={v => setTweak('gravity',     v)} min={0.5} max={2.0} step={0.05} />
            </TweakSection>
            <TweakSection label="UI">
              <TweakToggle label="Show drag hint" value={t.showHints} onChange={v => setTweak('showHints', v)} />
            </TweakSection>
            <TweakSection label="Leaderboard">
              <TweakButton
                label="Reset leaderboard"
                onClick={() => { if (window.confirm('Wipe all scores from the leaderboard?')) clearLB(); }}
              />
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
