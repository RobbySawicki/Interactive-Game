<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>OREO Stuf of Legends — iPad</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Boogaloo&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #0A1A3F; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    #root { width: 100vw; height: 100vh; }
  </style>

  <script>
    // Asset path: in dev preview, assets/ at this folder isn't served, so fall
    // back to the project-root assets/ via a relative climb. On real GitHub
    // Pages, assets/ alongside index.html is served fine.
    // Auto-detect: try a HEAD on assets/lockup-pos.png; if 404, use ../../assets/.
    (function() {
      window.ASSET_BASE = 'assets/';
      // Synchronous detection isn't possible; instead, both paths are tried at
      // image-load time via onerror swap below. Keep window.ASSET_BASE flexible.
    })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="../firebase-config.js"></script>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <rect width="200" height="200" fill="#0A1A3F"/>
      <circle cx="100" cy="100" r="58" fill="#0a0a0a"/>
      <circle cx="100" cy="100" r="50" fill="#fff"/>
      <circle cx="100" cy="100" r="44" fill="#0a0a0a"/>
      <text x="100" y="112" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="28" fill="#FFD60A" letter-spacing="2">OREO</text>
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <script>
    // Auto-fallback: if assets/ at this folder 404s, switch to ../../assets/
    // (project-root) before any React mounts. This keeps the dev preview working.
    (async function() {
      try {
        const r = await fetch('assets/lockup-pos.png', { method: 'HEAD' });
        if (!r.ok) window.ASSET_BASE = '../../assets/';
      } catch (e) {
        window.ASSET_BASE = '../../assets/';
      }
      window.__ASSET_BASE_READY = true;
      window.dispatchEvent(new Event('asset-base-ready'));
    })();
  </script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="game-shared.jsx"></script>
  <script type="text/babel" src="ipad-game.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "throwPower": 1.0,
      "targetSpeed": 1.0,
      "gravity": 1.0,
      "showHints": true
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [ready, setReady] = React.useState(!!window.__ASSET_BASE_READY);

      React.useEffect(() => {
        if (ready) return;
        const onReady = () => setReady(true);
        window.addEventListener('asset-base-ready', onReady);
        return () => window.removeEventListener('asset-base-ready', onReady);
      }, [ready]);

      if (!ready) return <div style={{ color: '#fff', padding: 40, fontFamily: 'Inter' }}>Loading…</div>;

      return (
        <div style={{ width: '100%', height: '100%', position: 'relative' }}>
          <IpadGame tweaks={t} />
          <TweaksPanel title="Tweaks">
            <TweakSection label="Game Feel">
              <TweakSlider label="Throw Power"  value={t.throwPower}  onChange={v => setTweak('throwPower',  v)} min={0.5} max={2.0} step={0.05} />
              <TweakSlider label="Target Speed" value={t.targetSpeed} onChange={v => setTweak('targetSpeed', v)} min={0.5} max={2.5} step={0.05} />
              <TweakSlider label="Gravity"      value={t.gravity}     onChange={v => setTweak('gravity',     v)} min={0.5} max={2.0} step={0.05} />
            </TweakSection>
            <TweakSection label="UI">
              <TweakToggle label="Show drag hint" value={t.showHints} onChange={v => setTweak('showHints', v)} />
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
