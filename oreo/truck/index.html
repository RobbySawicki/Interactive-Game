<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LED Truck — Stuf of Legends</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Boogaloo&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; font-family: Inter, system-ui, sans-serif; cursor: none; }
    * { box-sizing: border-box; }
    #root { width: 100vw; height: 100vh; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="../firebase-config.js"></script>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <rect width="200" height="200" fill="#0A1A3F"/>
      <text x="100" y="120" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="48" fill="#FFD60A">LED</text>
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="game-shared.jsx"></script>
  <script type="text/babel" src="truck-display.jsx"></script>

  <script type="text/babel">
    // Fullscreen LED truck side-panel display.
    // The TruckDisplay component already self-scales to its container at
    // the native 1007x432 aspect — letterboxed on black if the screen
    // doesn't match. Drives the spectator hype layer (live score,
    // multiplier, reaction word, leaderboard).
    //
    // For the rear square QR panel, append ?panel=rear to the URL.
    function App() {
      const params = new URLSearchParams(window.location.search);
      const isRear = params.get('panel') === 'rear';
      return (
        <div style={{ width: '100%', height: '100%', position: 'relative', background: '#000' }}>
          {isRear ? <TruckRear /> : <TruckDisplay />}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
