<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OREO × Spider-Man — Sling The Stuf</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh; width: 100%;
      font-family: Inter, system-ui, sans-serif;
      background: #0A1A3F;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .wrap { width: min(720px, 92vw); padding: 40px 0; text-align: center; }
    h1 {
      font-family: Bangers, Impact, sans-serif;
      font-size: clamp(40px, 7vw, 72px);
      letter-spacing: 0.02em;
      margin: 0 0 4px;
      color: #FFD60A;
      text-shadow: 4px 4px 0 #E60E2C;
    }
    p.sub {
      margin: 0 0 36px;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    a.card {
      display: block;
      padding: 28px 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
    }
    a.card:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,214,10,0.5);
      transform: translateY(-2px);
    }
    .label {
      font-family: Bangers, Impact, sans-serif;
      font-size: 26px;
      letter-spacing: 0.04em;
      color: #FFD60A;
      margin-bottom: 6px;
    }
    .desc {
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      line-height: 1.5;
    }
    .back {
      display: inline-block;
      margin-top: 32px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .back:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Sling The Stuf</h1>
    <p class="sub">OREO × Spider-Man Activation</p>
    <div class="grid">
      <a class="card" href="preview-side-by-side.html">
        <div class="label">Preview</div>
        <div class="desc">iPad + truck side-by-side in one view</div>
      </a>
      <a class="card" href="ipad/">
        <div class="label">iPad</div>
        <div class="desc">Player slingshot game</div>
      </a>
      <a class="card" href="truck/">
        <div class="label">Truck</div>
        <div class="desc">LED side panel — score &amp; hype</div>
      </a>
      <a class="card" href="truck/?panel=rear">
        <div class="label">Truck Rear</div>
        <div class="desc">Square QR + comic burst panel</div>
      </a>
    </div>
    <a class="back" href="/">← Back</a>
  </div>
</body>
</html>
